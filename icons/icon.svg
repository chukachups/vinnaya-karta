<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="80%">
      <stop offset="0" stop-color="#3a5540"/>
      <stop offset=".55" stop-color="#22342a"/>
      <stop offset="1" stop-color="#141f17"/>
    </radialGradient>
    <linearGradient id="wine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6efa8"/>
      <stop offset=".45" stop-color="#e3da78"/>
      <stop offset="1" stop-color="#b9a43c"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fffffb" stop-opacity=".22"/>
      <stop offset=".5" stop-color="#fffffb" stop-opacity=".05"/>
      <stop offset="1" stop-color="#fffffb" stop-opacity=".16"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#e3da78" stop-opacity=".35"/>
      <stop offset="1" stop-color="#e3da78" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="bowl"><path id="bowlp" d="M338 236 C322 420 372 574 512 600 C652 574 702 420 686 236 Z"/></clipPath>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <circle cx="512" cy="470" r="330" fill="url(#glow)"/>
  <circle cx="512" cy="512" r="388" fill="none" stroke="#e3da78" stroke-opacity=".28" stroke-width="6" stroke-dasharray="2 22" stroke-linecap="round"/>
  <!-- bowl glass -->
  <path d="M338 236 C322 420 372 574 512 600 C652 574 702 420 686 236 Z" fill="url(#glass)"/>
  <!-- wine -->
  <g clip-path="url(#bowl)">
    <path d="M300 404 C380 384 444 420 512 404 C580 388 640 420 724 400 L724 640 L300 640 Z" fill="url(#wine)"/>
    <path d="M300 404 C380 384 444 420 512 404 C580 388 640 420 724 400" fill="none" stroke="#fffbd6" stroke-width="7" stroke-opacity=".8"/>
  </g>
  <!-- outline -->
  <path d="M338 236 C322 420 372 574 512 600 C652 574 702 420 686 236 Z" fill="none" stroke="#fffbe8" stroke-width="14" stroke-linejoin="round"/>
  <path d="M512 600 L512 770" stroke="#fffbe8" stroke-width="16" stroke-linecap="round"/>
  <path d="M400 790 Q512 762 624 790" fill="none" stroke="#fffbe8" stroke-width="16" stroke-linecap="round"/>
  <!-- highlight -->
  <path d="M384 282 C376 380 392 450 424 500" fill="none" stroke="#ffffff" stroke-opacity=".55" stroke-width="12" stroke-linecap="round"/>
  <!-- sparkle -->
  <path d="M716 214 l10 28 28 10 -28 10 -10 28 -10 -28 -28 -10 28 -10z" fill="#efe9a6"/>
  <path d="M290 590 l6 16 16 6 -16 6 -6 16 -6 -16 -16 -6 16 -6z" fill="#efe9a6" fill-opacity=".7"/>
</svg>
